name: Deploy site

# main            -> production at https://ceqamap.org
# pull requests   -> review copy at https://preview.ceqamap.org (most recent PR wins)
# Merging a reviewed PR into main is what publishes a change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Skips until the Cloudflare settings exist, and for PRs from forks (no secrets there).
    if: >-
      vars.DATA_URL != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_DATA_URL: ${{ vars.DATA_URL }}

      - name: Keep the preview out of search engines
        if: github.event_name == 'pull_request'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> web/dist/_headers

      # Run Wrangler directly: wrangler-action tries to add itself to the pnpm
      # workspace root, which pnpm refuses.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy ${{ github.event_name == 'pull_request' && '--env preview' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post the preview link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-link -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** https://preview.ceqamap.org (commit \`${sha}\`)\n\n` +
              'Shows the most recently updated pull request. Merge to publish to https://ceqamap.org.';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

name: Data refresh

# Pulls new documents from CEQAnet and republishes the map data.
#
# Schedule: every 3 hours. CEQAnet posts during California business hours, so
# this keeps the map at most ~3 hours behind. A rebuild is forced once a day
# even without new documents because comment periods open and close with the
# calendar. Use "Run workflow" in the Actions tab for a manual refresh or the
# initial backfill.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'ingest (recent window) or backfill (history)'
        type: choice
        options: [ingest, backfill]
        default: ingest
      from:
        description: 'Backfill start month (YYYY-MM)'
        default: '1980-01'
      force_build:
        description: 'Rebuild and publish even if nothing changed'
        type: boolean
        default: false
      target:
        description: 'production, or preview (build this branch into preview-data for review; no fetching)'
        type: choice
        options: [production, preview]
        default: production

# Never run two refreshes at once; queue instead of cancelling.
concurrency:
  group: data-refresh-${{ inputs.target || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CEQANET_CONTACT: ${{ vars.CEQANET_CONTACT }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  TIPPECANOE_VERSION: '2.79.0'

jobs:
  refresh:
    # Skips until the R2 settings exist (see README, One-time production setup).
    if: vars.R2_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile --filter @ceqa-atlas/pipeline...; else pnpm install --filter @ceqa-atlas/pipeline...; fi
      - name: Restore city, county and ZIP boundaries
        uses: actions/cache@v6
        with:
          path: pipeline/data/boundaries.json
          key: boundaries-${{ hashFiles('pipeline/scripts/fetch-boundaries.ts', 'pipeline/src/lib/boundaries.ts', 'pipeline/src/lib/geometry.ts', 'pipeline/src/lib/shapefile.ts') }}
      - name: Ensure city, county and ZIP boundaries
        run: node pipeline/scripts/boundaries-current.ts || NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @ceqa-atlas/pipeline boundaries

      - name: Backfill history
        if: inputs.mode == 'backfill' && inputs.target != 'preview'
        run: pnpm --filter @ceqa-atlas/pipeline backfill --from "${{ inputs.from }}"

      - name: Ingest recent documents
        id: ingest
        if: inputs.mode != 'backfill' && inputs.target != 'preview'
        run: pnpm --filter @ceqa-atlas/pipeline ingest

      - name: Decide whether to rebuild
        id: decide
        run: |
          # Rebuild if documents changed, on a manual force or backfill, or on the
          # first scheduled run of the day (00:17 UTC) so statuses roll over.
          if [ "${{ steps.ingest.outputs.changed }}" = "true" ] \
             || [ "${{ inputs.force_build }}" = "true" ] \
             || [ "${{ inputs.mode }}" = "backfill" ] \
             || [ "${{ inputs.target }}" = "preview" ] \
             || [ "$(date -u +%H)" = "00" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore tippecanoe
        if: steps.decide.outputs.build == 'true'
        id: tippecanoe-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-ubuntu-24.04

      - name: Build tippecanoe
        if: steps.decide.outputs.build == 'true' && steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "${TIPPECANOE_VERSION}" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/.local/bin && cp /tmp/tippecanoe/tippecanoe ~/.local/bin/

      - name: Restore Census road and water files
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: .tiger
          # Roads and linear water (streams, canals) per county. The cache is
          # immutable once saved: change the key when adding layers.
          key: tiger-2024-ca-roads-water
          restore-keys: tiger-roads-2024-ca

      - name: Restore named places (USGS GNIS)
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: pipeline/data/gnis.json
          key: gnis-${{ hashFiles('pipeline/scripts/fetch-gnis.ts', 'pipeline/src/lib/landmarks.ts') }}

      - name: Ensure named places
        if: steps.decide.outputs.build == 'true'
        # Optional: if USGS is unreachable, the build places these projects the old way.
        continue-on-error: true
        run: test -f pipeline/data/gnis.json || node pipeline/scripts/fetch-gnis.ts

      - name: Restore highway postmiles (Caltrans)
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: pipeline/data/postmiles.json
          key: postmiles-${{ hashFiles('pipeline/scripts/fetch-postmiles.ts', 'pipeline/src/lib/postmiles.ts') }}

      - name: Ensure highway postmiles
        if: steps.decide.outputs.build == 'true'
        # Optional: if Caltrans is unreachable, the build places these projects the old way.
        continue-on-error: true
        run: test -f pipeline/data/postmiles.json || node pipeline/scripts/fetch-postmiles.ts

      - name: Build data
        if: steps.decide.outputs.build == 'true'
        env:
          TIGER_DIR: ${{ github.workspace }}/.tiger
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          export TIPPECANOE="$HOME/.local/bin/tippecanoe"
          pnpm --filter @ceqa-atlas/pipeline build-data

      - name: Publish data
        if: steps.decide.outputs.build == 'true'
        run: pnpm --filter @ceqa-atlas/pipeline publish-data
        env:
          PUBLISH_PREFIX: ${{ inputs.target == 'preview' && 'preview-data' || 'data' }}

  # If the refresh fails, GitHub emails the repository's watchers. This job
  # additionally opens an issue so failures are visible on the repo itself.
  report-failure:
    needs: refresh
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Data refresh is failing';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'data-refresh' });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['data-refresh'] });
            }

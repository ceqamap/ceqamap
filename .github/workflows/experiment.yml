name: Data experiment

# Runs a pipeline script against the real stored data, for prototypes and
# reports (e.g. intersection matching). Results go to the log and to state/;
# nothing public changes.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script in pipeline/scripts to run'
        type: choice
        options: [match-intersections, profile-locations, match-landmarks, explain-location]
        default: match-intersections
      sch:
        description: 'SCH numbers to explain, comma-separated (explain-location)'
        default: ''

concurrency:
  group: experiment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: vars.R2_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      TIGER_DIR: ${{ github.workspace }}/.tiger
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ceqa-atlas/pipeline...
      - name: Restore Census road files
        uses: actions/cache@v6
        with:
          path: .tiger
          key: tiger-roads-2024-ca
      - name: Restore city, county and ZIP boundaries
        uses: actions/cache@v6
        with:
          path: pipeline/data/boundaries.json
          key: boundaries-${{ hashFiles('pipeline/scripts/fetch-boundaries.ts', 'pipeline/src/lib/boundaries.ts', 'pipeline/src/lib/geometry.ts', 'pipeline/src/lib/shapefile.ts') }}
      - name: Ensure city, county and ZIP boundaries
        run: node pipeline/scripts/boundaries-current.ts || NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @ceqa-atlas/pipeline boundaries
      - name: Fetch GNIS names
        if: inputs.script == 'match-landmarks' || inputs.script == 'explain-location'
        run: node pipeline/scripts/fetch-gnis.ts
      - name: Run
        env:
          EXPLAIN: ${{ inputs.sch }}
        run: node --max-old-space-size=6144 pipeline/scripts/${{ inputs.script || 'match-intersections' }}.ts
